name: 贵金属全景图自动更新
on:
  schedule:
    - cron: '30 22 * * *'      # 每天 06:30 北京时间 = 22:30 UTC
    - cron: '45 7 * * 1-5'     # 工作日 15:45 北京时间 = 07:45 UTC
  workflow_dispatch:           # 网页上点 Run workflow 即可手动更新
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas numpy akshare
      - name: 拉取基线
        run: |
          set -e
          curl -fsL "https://premetal-panorama.ok.kimi.link" -o base.html
          grep -q "window.DASHBOARD_DATA=" base.html
          curl -fsL "https://premetal-panorama.ok.kimi.link/rawdata.zip" -o rawdata.zip
          curl -fsL "https://premetal-panorama.ok.kimi.link/pipeline.zip" -o pipeline.zip
          mkdir -p rawdata data pipeline
          unzip -qo rawdata.zip -d rawdata
          unzip -qo pipeline.zip -d pipeline
      - name: 刷新数据
        env:
          GSD_DATA: ${{ github.workspace }}/rawdata
          GSD_OUT: ${{ github.workspace }}/data
        run: python pipeline/refresh_daily.py
        continue-on-error: true
      - name: 计算看板
        env:
          GSD_DATA: ${{ github.workspace }}/rawdata
          GSD_OUT: ${{ github.workspace }}/data
        run: python pipeline/compute.py
      - run: python build_site.py
      - name: 提交发布
        run: |
          git config user.name "gold-silver-bot"
          git config user.email "actions@github.com"
          git add index.html data/dashboard.js
          git diff --cached --quiet && exit 0
          git commit -m "数据更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
